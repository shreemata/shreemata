<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0e2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sign Up - Shree Mata</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <style>
        /* ---------- Page Background ---------- */
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #0f0e2a 0%, #1a1860 50%, #0f0e2a 100%);
            background-size: 400% 400%;
            animation: bgShift 25s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            color: #e2e8f0;
            position: relative;
        }

        /* Cosmic Aurora Effect */
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 20% 80%, rgba(201,162,39,0.08) 0%, transparent 40%),
                        radial-gradient(circle at 80% 20%, rgba(79,70,229,0.1) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(201,162,39,0.05) 0%, transparent 50%);
            animation: auroraShift 30s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes auroraShift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(3deg); }
        }

        /* Decorative Book Illustration */
        .books-bg {
            background-image: url("https://cdn-icons-png.flaticon.com/512/3145/3145765.png");
            background-size: 300px;
            background-repeat: no-repeat;
            opacity: 0.04;
            position: absolute;
            top: 20%; right: 5%;
            width: 300px; height: 300px;
            pointer-events: none;
            animation: gentleSpin 80s linear infinite;
            filter: invert(1) sepia(1) saturate(5) hue-rotate(10deg) brightness(1.2);
            z-index: 0;
        }
        @keyframes gentleSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ---------- Ambient glow orbs ---------- */
        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(80px); opacity: 0.25;
            pointer-events: none; z-index: 0;
        }
        .orb-1 { width: 300px; height: 300px; background: #c9a227; top: -100px; right: -100px; animation: drift1 22s ease-in-out infinite; }
        .orb-2 { width: 250px; height: 250px; background: #4f46e5; bottom: -80px; left: -80px; animation: drift2 26s ease-in-out infinite; }
        .orb-3 { width: 200px; height: 200px; background: #7c3aed; top: 45%; left: 8%; animation: drift3 20s ease-in-out infinite; }

        @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,40px) scale(1.15); } }
        @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,-30px) scale(1.1); } }
        @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,50px); } }

        /* ---------- Floating Golden Dust ---------- */
        .gold-dust {
            position: fixed; width: 3px; height: 3px;
            background: #f0c96b; border-radius: 50%;
            pointer-events: none; z-index: 1;
            box-shadow: 0 0 10px #c9a227, 0 0 20px rgba(201,162,39,0.5);
            animation: dustFloat linear infinite;
            opacity: 0;
        }
        @keyframes dustFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* ---------- Floating ambient particles ---------- */
        .floaty {
            position: fixed; pointer-events: none; z-index: 1;
            opacity: 0.15; font-size: 30px;
            filter: drop-shadow(0 0 10px rgba(201,162,39,0.4));
            animation: floatY 12s ease-in-out infinite;
        }
        .floaty-1 { top: 10%; right: 8%; animation-duration: 14s; }
        .floaty-2 { top: 24%; left: 10%; font-size: 22px; animation-duration: 10s; animation-delay: 1s; }
        .floaty-3 { bottom: 16%; right: 14%; font-size: 26px; animation-duration: 16s; animation-delay: 2s; }
        .floaty-4 { bottom: 30%; left: 6%; font-size: 24px; animation-duration: 11s; animation-delay: 0.5s; }

        @keyframes floatY {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        .particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

        @media (max-width: 600px) {
            .floaty, .books-bg { display: none; }
            .orb { opacity: 0.15; }
        }

        /* ---------- Generic Container ---------- */
        .container { width: 90%; max-width: 1100px; margin: 0 auto; position: relative; z-index: 2; }

        /* ---------- Navbar ---------- */
        .navbar {
            background: rgba(15, 14, 42, 0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 15px 0;
            border-bottom: 1px solid rgba(201,162,39,0.15);
            position: relative; z-index: 10;
            animation: slideDown 0.6s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .navbar-content { display: flex; justify-content: space-between; align-items: center; }

        .logo a {
            text-decoration: none; font-size: 22px; font-weight: 700;
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #c9a227, #f0c96b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            padding: 8px 12px; border-radius: 12px;
            transition: all 0.3s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .logo a:hover { transform: translateY(-2px); filter: drop-shadow(0 4px 12px rgba(201,162,39,0.4)); }
        .logo img { transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .logo a:hover img { transform: rotate(360deg) scale(1.15); }

        .nav-links { display: flex; align-items: center; }
        .nav-links a {
            margin-left: 20px; text-decoration: none;
            color: rgba(255,255,255,0.8); font-weight: 500; font-size: 14px;
            position: relative; transition: all 0.3s ease;
        }
        .nav-links a::after {
            content: ''; position: absolute; left: 0; bottom: -4px;
            width: 0%; height: 2px;
            background: linear-gradient(135deg, #c9a227, #f0c96b);
            transition: width 0.3s ease; border-radius: 2px;
        }
        .nav-links a:hover { color: #f0c96b; transform: translateY(-2px); }
        .nav-links a:hover::after { width: 100%; }

        /* ---------- Auth Layout ---------- */
        .auth-container {
            display: flex; justify-content: center; align-items: flex-start;
            padding: 40px 0 50px; position: relative; z-index: 5;
            perspective: 1200px;
        }

        .auth-box {
            width: 100%; max-width: 480px;
            padding: 36px 32px; border-radius: 24px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            background: rgba(15, 14, 42, 0.65);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: cardIn 0.9s cubic-bezier(0.21, 1.02, 0.73, 1) both;
            position: relative; z-index: 2;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            transform-style: preserve-3d;
            border: 1px solid rgba(201,162,39,0.25);
            overflow: hidden;
        }

        /* Animated shimmering border */
        .auth-box::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, transparent, #c9a227, transparent, #f0c96b, transparent);
            background-size: 400% 400%;
            border-radius: 26px; z-index: -1; opacity: 0.4;
            animation: gradientBorder 8s ease infinite;
        }
        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95) rotateX(15deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); }
        }

        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 16px; border-radius: 999px;
            background: rgba(201,162,39,0.12);
            font-size: 12px; font-weight: 600; color: #f0c96b;
            margin: 0 auto 12px;
            border: 1px solid rgba(201,162,39,0.25);
            animation: badgeIn 0.6s ease 0.1s both;
        }
        @keyframes badgeIn { from { opacity: 0; transform: translateY(-10px) scale(0.8); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .badge .twinkle { display: inline-block; animation: twinkle 2.2s ease-in-out infinite; }
        @keyframes twinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.25) rotate(15deg); opacity: 0.7; }
        }

        /* ---------- CUSTOM AVATAR ---------- */
        .avatar-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 120px; height: 120px;
            margin-bottom: 15px;
            animation: badgeIn 0.6s ease 0s both;
        }
        .avatar-svg {
            width: 100%; height: 100%;
            position: relative; z-index: 2;
            animation: avatarFloat 5s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(201,162,39,0.4));
        }
        .avatar-ring {
            position: absolute; top: 50%; left: 50%;
            width: 110px; height: 110px; border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(201,162,39,0.4);
            animation: avatarPulse 3s ease-out infinite;
        }
        .avatar-ring.ring-2 {
            width: 130px; height: 130px;
            border-color: rgba(79,70,229,0.3);
            animation-delay: 1.5s;
        }
        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes avatarPulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
        }

        .auth-box h1 {
            text-align: center; margin: 0 0 8px;
            color: #fff; font-size: 26px; font-family: 'Playfair Display', serif;
            animation: badgeIn 0.6s ease 0.3s both;
        }
        .auth-subtitle {
            text-align: center; margin-bottom: 24px;
            color: rgba(255,255,255,0.6); font-size: 14px;
            animation: badgeIn 0.6s ease 0.4s both;
            overflow: hidden; white-space: nowrap;
            border-right: 2px solid #c9a227; width: 0;
            animation: badgeIn 0.6s ease 0.4s both, typing 2s steps(30, end) 0.8s forwards, blinkCaret 0.75s step-end infinite;
        }
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blinkCaret { from, to { border-color: transparent; } 50% { border-color: #c9a227; } }

        /* Progress steps */
        .steps { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; animation: badgeIn 0.6s ease 0.5s both; }
        .step-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .step-dot.active {
            background: linear-gradient(135deg, #c9a227, #f0c96b);
            transform: scale(1.2);
            animation: dotPulse 2.4s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(201,162,39,0.4); }
            50% { box-shadow: 0 0 0 6px rgba(201,162,39,0); }
        }

        /* ---------- Form Styling ---------- */
        .form-group { margin-bottom: 18px; position: relative; }
        label {
            display: block; font-weight: 600; margin-bottom: 6px;
            font-size: 13px; color: rgba(255,255,255,0.8);
            transition: all 0.3s ease;
        }
        .form-group:focus-within label { color: #f0c96b; transform: translateX(4px); }

        .input-wrapper { position: relative; }
        input {
            width: 100%; padding: 13px 14px; border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,0.1); outline: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px; box-sizing: border-box;
            background: rgba(15, 14, 42, 0.6); color: #fff;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus {
            border-color: #c9a227;
            box-shadow: 0 0 0 4px rgba(201,162,39,0.15), 0 0 20px rgba(201,162,39,0.1);
            background: rgba(15, 14, 42, 0.8);
            transform: translateY(-2px);
        }

        .input-wrapper::after {
            content: ''; position: absolute; bottom: 0; left: 50%;
            width: 0; height: 2px;
            background: linear-gradient(90deg, #c9a227, #f0c96b);
            transition: all 0.4s ease; border-radius: 2px;
            transform: translateX(-50%);
        }
        .input-wrapper:focus-within::after { width: 100%; }

        .input-icon {
            position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%); font-size: 16px;
            opacity: 0.5; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2;
        }
        .input-wrapper:focus-within .input-icon {
            opacity: 1; transform: translateY(-50%) scale(1.3);
            color: #f0c96b; filter: drop-shadow(0 0 8px rgba(201,162,39,0.6));
        }

        /* ---------- Button ---------- */
        .btn-primary {
            background: linear-gradient(135deg, #c9a227, #f0c96b, #c9a227);
            background-size: 220% auto;
            color: #0f0e2a; border: none; border-radius: 12px;
            padding: 14px; font-size: 15px; font-weight: 700;
            cursor: pointer; width: 100%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(201,162,39,0.3);
        }
        .btn-primary::after {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(30deg) translateX(-100%);
            transition: transform 0.6s ease;
        }
        .btn-primary:hover::after { transform: rotate(30deg) translateX(100%); }
        .btn-primary:hover {
            background-position: right center;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(201,162,39,0.5);
        }
        .btn-primary:active { transform: translateY(-1px) scale(0.98); }

        /* Secondary Button (Resend OTP) */
        #resendOtpBtn {
            background: rgba(255,255,255,0.05) !important;
            color: rgba(255,255,255,0.8) !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
            box-shadow: none !important;
        }
        #resendOtpBtn:hover {
            background: rgba(255,255,255,0.1) !important;
            color: #f0c96b !important;
            border-color: rgba(201,162,39,0.4) !important;
            transform: translateY(-2px);
        }

        .error-message {
            color: #fca5a5; font-size: 13px; margin-bottom: 10px;
            animation: shakeIn 0.4s ease;
            background: rgba(239, 68, 68, 0.15);
            padding: 10px 14px; border-radius: 8px;
            border-left: 3px solid #ef4444;
        }
        @keyframes shakeIn {
            0% { opacity: 0; transform: translateX(-10px); }
            20% { opacity: 1; transform: translateX(8px); }
            100% { transform: translateX(0); }
        }

        .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.6); }
        .auth-footer a { color: #f0c96b; font-weight: 600; text-decoration: none; position: relative; transition: all 0.3s ease; }
        .auth-footer a::after {
            content: ''; position: absolute; left: 0; bottom: -2px;
            width: 0%; height: 1.5px; background: linear-gradient(90deg, #c9a227, #f0c96b);
            transition: width 0.3s ease;
        }
        .auth-footer a:hover { transform: translateY(-1px); text-shadow: 0 0 10px rgba(201,162,39,0.5); }
        .auth-footer a:hover::after { width: 100%; }

        footer { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.4); font-size: 13px; padding-bottom: 20px; z-index: 2; position: relative; }

        /* ---------- OTP Section & Status ---------- */
        #emailOtpSection {
            background: rgba(26, 24, 96, 0.5);
            border: 1px solid rgba(201,162,39,0.2);
            border-left: 4px solid #c9a227;
            padding: 16px; border-radius: 12px;
            animation: fadeSlideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #phoneStatus.success, #emailStatus.success, #otpStatus.success {
            color: #86efac; background-color: rgba(34, 197, 94, 0.15);
            padding: 8px 12px; border-radius: 8px; border-left: 3px solid #22c55e;
            animation: statusPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); margin-top: 8px; font-size: 13px;
        }
        #phoneStatus.error, #emailStatus.error, #otpStatus.error {
            color: #fca5a5; background-color: rgba(239, 68, 68, 0.15);
            padding: 8px 12px; border-radius: 8px; border-left: 3px solid #ef4444;
            animation: shakeIn 0.4s ease; margin-top: 8px; font-size: 13px;
        }
        #emailStatus.info, #otpStatus.info {
            color: #93c5fd; background-color: rgba(59, 130, 246, 0.15);
            padding: 8px 12px; border-radius: 8px; border-left: 3px solid #3b82f6;
            animation: statusPop 0.4s ease; margin-top: 8px; font-size: 13px;
        }
        @keyframes statusPop { from { opacity: 0; transform: translateY(-8px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(-12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .toggle-password {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%); background: none; border: none;
            cursor: pointer; font-size: 18px; color: rgba(255,255,255,0.5);
            transition: all 0.3s ease; z-index: 2; padding: 4px; border-radius: 50%;
        }
        .toggle-password:hover {
            color: #f0c96b; transform: translateY(-50%) scale(1.2);
            background: rgba(201,162,39,0.1);
        }

        /* Referral Input */
        #referralInput {
            background: rgba(201,162,39,0.05);
            border: 1.5px dashed rgba(201,162,39,0.4);
        }
        #referralInput:focus {
            border-style: solid; background: rgba(15, 14, 42, 0.8); border-color: #c9a227;
        }

        #emailOtp { text-align: center; font-size: 18px; letter-spacing: 8px; font-weight: 600; }

        /* Confetti */
        .confetti { position: fixed; width: 10px; height: 10px; pointer-events: none; z-index: 9999; animation: confettiFall 3s linear forwards; }
        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        .magnetic-btn { transition: transform 0.2s ease; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
        @media (max-width: 600px) {
            .auth-box { padding: 26px 20px; }
            .auth-subtitle { white-space: normal; animation: badgeIn 0.6s ease 0.4s both; border-right: none; width: auto; }
        }
    </style>
</head>
<body>
    <div class="books-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <canvas class="particle-canvas" id="particleCanvas"></canvas>

    <!-- Golden Dust Particles -->
    <div class="gold-dust" style="left: 10%; animation-duration: 12s; animation-delay: 0s;"></div>
    <div class="gold-dust" style="left: 25%; animation-duration: 15s; animation-delay: 2s;"></div>
    <div class="gold-dust" style="left: 40%; animation-duration: 10s; animation-delay: 4s;"></div>
    <div class="gold-dust" style="left: 60%; animation-duration: 14s; animation-delay: 1s;"></div>
    <div class="gold-dust" style="left: 75%; animation-duration: 11s; animation-delay: 3s;"></div>
    <div class="gold-dust" style="left: 90%; animation-duration: 16s; animation-delay: 5s;"></div>

    <div class="floaty floaty-1">📖</div>
    <div class="floaty floaty-2">✨</div>
    <div class="floaty floaty-3">🪔</div>
    <div class="floaty floaty-4">📚</div>

    <header>
        <div class="navbar">
            <div class="container navbar-content">
                <div class="logo">
                    <a href="/" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
                        <img src="/images/press.png" alt="Shree Mata Logo" style="width: 45px; height: 45px; ">
                        <span>Shree Mata</span>
                    </a>
                </div>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="login.html">Login</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="auth-container">
                <div class="auth-box" id="authBox">
                    <div style="text-align: center;">
                        <div class="badge">
                            <span class="twinkle">⭐</span> New here? <span>Create your free account</span>
                        </div>
                        
                        <div class="logo-wrap">
                            <img src="/images/press.png" alt="Shree Mata Logo" style="width: 90px; height: 90px;">
                        </div>

                        <h1>Create Account</h1>
                        <p class="auth-subtitle">Join Shree Mata to start your reading journey</p>
                    </div>

                    <div class="steps">
                        <div class="step-dot active"></div>
                        <div class="step-dot"></div>
                        <div class="step-dot"></div>
                    </div>

                    <form id="signupForm">
                        <div class="form-group">
                            <label for="name">👤 Full Name</label>
                            <div class="input-wrapper">
                                <input type="text" id="name" name="name" required placeholder="Enter your full name">
                                <span class="input-icon">👤</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">📧 Email</label>
                            <div class="input-wrapper">
                                <input type="email" id="email" name="email" required placeholder="Enter your email">
                                <span class="input-icon">📧</span>
                            </div>
                            <button type="button" id="verifyEmailBtn" class="btn-primary magnetic-btn" style="margin-top: 8px; padding: 8px 16px; font-size: 13px; display: none;">
                                Verify Email ✉️
                            </button>
                            <div id="emailStatus" style="margin-top: 5px; font-size: 13px;"></div>
                        </div>

                        <!-- Email OTP Verification Section -->
                        <div id="emailOtpSection" class="form-group" style="display: none;">
                            <label for="emailOtp">🔐 Email Verification Code</label>
                            <div class="input-wrapper">
                                <input type="text" id="emailOtp" name="emailOtp" placeholder="Enter 6-digit code" maxlength="6" pattern="[0-9]{6}">
                                <span class="input-icon">🔐</span>
                            </div>
                            <div style="display: flex; gap: 8px; margin-top: 10px;">
                                <button type="button" id="verifyOtpBtn" class="btn-primary magnetic-btn" style="flex: 1; padding: 8px 16px; font-size: 13px;">
                                    Verify Code ✓
                                </button>
                                <button type="button" id="resendOtpBtn" class="btn-primary magnetic-btn" style="flex: 1; padding: 8px 16px; font-size: 13px;">
                                    Resend 🔄
                                </button>
                            </div>
                            <div id="otpStatus" style="margin-top: 8px; font-size: 13px;"></div>
                        </div>

                        <div class="form-group">
                            <label for="phone">📱 Mobile Number</label>
                            <div class="input-wrapper">
                                <input type="text" id="phone" name="phone" placeholder="Enter 10-digit mobile number" required maxlength="10" pattern="[6-9][0-9]{9}">
                                <span class="input-icon">📱</span>
                            </div>
                            <div id="phoneStatus" style="margin-top: 5px; font-size: 13px;"></div>
                        </div>

                        <div class="form-group">
                            <label for="password">🔒 Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="password" name="password" required placeholder="Enter your password (min 6 characters)">
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">🔒 Confirm Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">👁️</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="referralInput">🎁 Referral Code (optional)</label>
                            <div class="input-wrapper">
                                <input type="text" id="referralInput" name="referralInput" placeholder="Enter referral code if you have one">
                                <span class="input-icon">🎁</span>
                            </div>
                        </div>

                        <div id="errorMessage" class="error-message" style="display: none;"></div>

                        <button type="submit" class="btn-primary magnetic-btn" id="signupBtn">
                            Create Account 🚀
                        </button>
                    </form>

                    <p class="auth-footer">
                        Already have an account? <a href="login.html">Login here ✨</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Shree Mata. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/config.js"></script>   
    <script src="js/signup.js"></script>
    <script>
        // 3D Tilt effect on auth box
        const authBox = document.getElementById('authBox');
        if (authBox) {
            authBox.addEventListener('mousemove', (e) => {
                const rect = authBox.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                authBox.style.transform = `perspective(1200px) rotateY(${x * 6}deg) rotateX(${-y * 6}deg) scale3d(1.02, 1.02, 1.02)`;
            });
            authBox.addEventListener('mouseleave', () => {
                authBox.style.transform = 'perspective(1200px) rotateY(0deg) rotateX(0deg) scale3d(1, 1, 1)';
            });
        }

        // Magnetic button effect
        document.querySelectorAll('.magnetic-btn').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                btn.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
            });
            btn.addEventListener('mouseleave', () => { btn.style.transform = 'translate(0, 0)'; });
        });

        // Particle canvas animation (Gold & Indigo theme)
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas(); window.addEventListener('resize', resizeCanvas);
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.3 - 0.15; this.speedY = Math.random() * 0.3 - 0.15;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.color = Math.random() > 0.5 ? '#c9a227' : '#4f46e5';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color; ctx.globalAlpha = this.opacity;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        function initParticles() {
            particles = [];
            const count = Math.min(60, Math.floor(canvas.width * canvas.height / 25000));
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            ctx.globalAlpha = 0.15; ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
                    if (Math.sqrt(dx*dx + dy*dy) < 110) {
                        ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles(); animateParticles();

        // Password visibility toggle
        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text'; button.textContent = '🙈';
            } else {
                input.type = 'password'; button.textContent = '👁️';
            }
        }

        // Confetti effect on successful signup
        function createConfetti() {
            const colors = ['#c9a227', '#f0c96b', '#ffe9a0', '#4f46e5', '#ffffff'];
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div'); confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%'; confetti.style.top = '-10px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.width = (Math.random() * 8 + 5) + 'px';
                confetti.style.height = (Math.random() * 8 + 5) + 'px';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        // Phone & OTP formatting
        const phoneInput = document.getElementById('phone');
        if (phoneInput) phoneInput.addEventListener('input', function() { this.value = this.value.replace(/\D/g, '').substring(0, 10); });
        
        const otpInput = document.getElementById('emailOtp');
        if (otpInput) otpInput.addEventListener('input', function() { this.value = this.value.replace(/\D/g, '').substring(0, 6); });

        // Progress steps animation
        function updateProgressSteps(step) {
            const dots = document.querySelectorAll('.step-dot');
            dots.forEach((dot, index) => {
                if (index < step) { dot.classList.add('active'); } 
                else { dot.classList.remove('active'); }
            });
        }
    </script>
</body>
</html>
